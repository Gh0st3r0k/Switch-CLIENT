<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electron UI</title>
    <link rel="stylesheet" href="mainPage.css">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
    <script type="module" src="mainPage.js"></script>
</head>
<body>
    <header>
        <div id="statusSwitch"></div>
        <h1 class="bold-italic" id="nameApp">Switch</h1>
        <button id="closeApp">
            <img src="../image/cross.svg" alt="Close" width="20" height="20">
        </button>
    </header>

    <section class="content">
        <article class="ports">
            <h2 class="italic" id="nameContent">Ports</h2>
            <div class="ports-container"></div>
        </article>

        <article class="mac-table">
            <h2 class="italic" id="nameContent">Mac-table</h2>
            <div class="table-wrapper">
                <table class="table-header">
                    <thead>
                        <tr>
                            <th class="column1">Port</th>
                            <th class="column2">Mac</th>
                            <th class="column3">Time</th>
                        </tr>
                    </thead>
                </table>
                <div class="table-container">
                    <table class="table-body">
                        <tbody>
                        <!--  -->
                        </tbody>
                    </table>
                </div>
            </div>
        </article>
    </section>

    <footer>
        <button class="footer-button" id="settingButton">Setting</button>
        <button class="footer-button ">Logs</button>
        <button class="footer-button ">Filters</button>
    </footer>

    <!-- <script src="mainPage.js"></script> -->

</body>
</html>
